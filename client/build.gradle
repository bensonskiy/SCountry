repositories {
    mavenCentral()
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    implementation project(':common')
    // Локальный API-jar гарантирует, что optional JourneyMap integration компилируется
    // даже когда Curse Maven недоступен.
    compileOnly files(rootProject.file("libs/journeymap-api-2.0.0-1.21.1.jar"))
}

neoForge {
    runs {
        client {
            client()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
    }
}

tasks.register('deployJar', Jar) {
    archiveClassifier = 'client'
    from project(':common').sourceSets.main.output
    from sourceSets.main.output
}